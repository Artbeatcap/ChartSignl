<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening ChartSignl…</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #FAFAF9; color: #44403C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 72px 24px; text-align: center; }
    .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: #14B8A6; }
    h1 { font-size: 24px; margin: 12px 0 8px; color: #1C1917; }
    p { font-size: 16px; line-height: 1.5; color: #78716C; }
    .btn { display: inline-block; margin-top: 24px; padding: 14px 28px; background: #3B82F6; color: #fff;
      text-decoration: none; font-weight: 700; border-radius: 10px; }
    .muted { margin-top: 16px; font-size: 13px; }
    .muted a { color: #78716C; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">ChartSignl</div>
    <h1>Opening the app</h1>
    <p>If you have ChartSignl installed, it should open now. Otherwise continue in the browser.</p>
    <a class="btn" id="open" href="chartsignl://analyze">Open ChartSignl</a>
    <p class="muted"><a href="https://www.chartsignl.com/analyze">Continue in browser</a></p>
  </div>
  <script>
    (function () {
      var APP_SCHEME = 'chartsignl://analyze';
      var ANDROID_INTENT =
        'intent://analyze#Intent;scheme=chartsignl;package=com.optionsplungellc.chartsignl;' +
        'S.browser_fallback_url=' + encodeURIComponent('https://www.chartsignl.com/analyze') + ';end';
      var WEB = 'https://www.chartsignl.com/analyze';
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isMobile = isAndroid || isIOS;

      var openBtn = document.getElementById('open');
      if (isAndroid) openBtn.setAttribute('href', ANDROID_INTENT);

      if (!isMobile) {
        window.location.replace(WEB);
        return;
      }

      var fallbackTimer = setTimeout(function () {
        if (!document.hidden) window.location.replace(WEB);
      }, 1500);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) clearTimeout(fallbackTimer);
      });
      window.addEventListener('pagehide', function () {
        clearTimeout(fallbackTimer);
      });

      window.location.href = isAndroid ? ANDROID_INTENT : APP_SCHEME;
    })();
  </script>
</body>
</html>
